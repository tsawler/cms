services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
      POSTGRES_DB: cms
    ports:
      # 5433 on the host to stay clear of any Postgres already on 5432.
      - "5433:5432"
    volumes:
      - cms_pgdata:/var/lib/postgresql/data

  # Cap (https://capjs.js.org): self-hosted proof-of-work CAPTCHA used by the
  # admin login form. One-time setup: open http://localhost:3300, log in with
  # ADMIN_KEY, create a site key, then put CAP_URL / CAP_SITE_KEY / CAP_SECRET
  # in .env (see main.go). Without those the CMS simply runs without CAPTCHA.
  cap:
    image: tiago2/cap:3.1
    ports:
      # 3300 on the host to stay clear of dev servers that favour 3000.
      - "3300:3000"
    environment:
      # Dashboard password. Development-only value; use a long random
      # secret (32+ chars) in real deployments.
      ADMIN_KEY: dev-cap-admin-key-change-me-1234567890
      REDIS_URL: redis://valkey:6379
      # Serve the widget JS from this container (/assets/widget.js) so the
      # login page needs no third-party CDN. In production, also pin
      # WIDGET_VERSION and WASM_VERSION instead of the "latest" default.
      ENABLE_ASSETS_SERVER: "true"
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9-alpine
    command: valkey-server --save 60 1 --loglevel warning --maxmemory-policy noeviction
    volumes:
      - cms_capdata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  cms_pgdata:
  cms_capdata:
